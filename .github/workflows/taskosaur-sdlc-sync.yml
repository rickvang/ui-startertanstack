# Generated from integrations/sdlc/collect.ts; edit that source and rerun render.ts.
name: Taskosaur SDLC sync
on:
  workflow_call:
    inputs:
      pull_request:
        type: string
        required: false
        default: '0'
permissions:
  actions: read
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  deployments: read
  id-token: write
concurrency:
  group: taskosaur-sdlc-reconcile
  cancel-in-progress: false
jobs:
  sdlc-sync:
    name: sdlc-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current GitHub evidence and synchronize Taskosaur
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        shell: bash
        run: |
          node --input-type=module <<'SDLC_SCRIPT'
          // This source is embedded in the trusted reusable workflow by render.ts.
          // It never checks out or executes PR code, and never accepts a caller's snapshot.
          import { readFile, appendFile } from "node:fs/promises";































          const repository = process.env.GITHUB_REPOSITORY ;
          const [owner, name] = repository.split("/");
          const endpoint = "https://work.rickvang.com/integrations/github-sdlc";
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          };
          async function github   (path        , body          )             {
            const r = await fetch(`https://api.github.com/${path}`, {
              method: body ? "POST" : "GET",
              redirect: "error",
              signal: AbortSignal.timeout(20000),
              headers,
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            if (!r.ok) throw Error(`GitHub HTTP ${r.status} on ${path}`);
            return r.json()              ;
          }
          const event = JSON.parse(
            await readFile(process.env.GITHUB_EVENT_PATH , "utf8"),
          );
          const numbers = new Set        ();
          if (event.pull_request?.number) numbers.add(event.pull_request.number);
          if (process.env.PR_NUMBER && Number(process.env.PR_NUMBER))
            numbers.add(Number(process.env.PR_NUMBER));
          for (const pr of event.workflow_run?.pull_requests || [])
            numbers.add(pr.number);
          // Every relevant event also reconciles open PRs, including checks with no PR in the payload.
          for (let page = 1; page <= 20; page++) {
            const prs = await github                                           (
              `repos/${repository}/pulls?state=open&per_page=100&page=${page}`,
            );
            for (const pr of prs)
              if (/^Taskosaur:/im.test(pr.body || "")) numbers.add(pr.number);
            if (prs.length < 100) break;
            if (page === 20)
              throw Error("Open PR scan exceeded the explicit safety bound");
          }
          // GitHub concurrency can replace pending runs. Rediscover recently closed PRs
          // so a later push/check event repairs a dropped merge/close notification.
          const closedCutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
          for (let page = 1; page <= 20; page++) {
            const prs = await github

             (
              `repos/${repository}/pulls?state=closed&sort=updated&direction=desc&per_page=100&page=${page}`,
            );
            for (const pr of prs)
              if (
                Date.parse(pr.updated_at) >= closedCutoff &&
                /^Taskosaur:/im.test(pr.body || "")
              )
                numbers.add(pr.number);
            if (prs.length < 100 || Date.parse(prs.at(-1) .updated_at) < closedCutoff)
              break;
            if (page === 20)
              throw Error("Closed PR reconciliation exceeded the explicit safety bound");
          }
          if (event.deployment?.sha) {
            const prs = await github                      (
              `repos/${repository}/commits/${event.deployment.sha}/pulls?per_page=100`,
            );
            for (const pr of prs) numbers.add(pr.number);
          }
          const query = `query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){number body headRefOid baseRefName state isDraft mergeStateStatus reviewDecision mergeCommit{oid} commits(last:1){nodes{commit{statusCheckRollup{contexts(first:100){pageInfo{hasNextPage} nodes{__typename ... on CheckRun{name conclusion status checkSuite{workflowRun{workflow{name}}}} ... on StatusContext{context state}}}}}}}}}}`;
          const summary           = [];
          const failures           = [];
          for (const number of numbers) {
            try {
              if (!Number.isSafeInteger(number) || number < 1)
                throw Error("Invalid PR number");
              const observedAt = new Date().toISOString();
              let pr                         ;
              for (let attempt = 0; attempt < 3; attempt++) {
                const data = await github


                  ("graphql", { query, variables: { owner, name, number } });
                if (data.errors || !data.data?.repository.pullRequest)
                  throw Error(
                    `GitHub PR query failed: ${data.errors?.map((error) => error.message).join("; ") || "missing PR"}`,
                  );
                pr = data.data.repository.pullRequest;
                if (
                  pr.state !== "OPEN" ||
                  pr.mergeStateStatus !== "UNKNOWN" ||
                  !/^Taskosaur:/im.test(pr.body || "")
                )
                  break;
                await new Promise((resolve) => setTimeout(resolve, 3000));
              }
              if (!pr) throw Error("Missing PR");
              const lines = (pr.body || "")
                .split(/\r?\n/)
                .filter((line) => /^Taskosaur:/i.test(line));
              if (!lines.length) continue;
              const match =
                lines.length === 1 &&
                lines[0].match(
                  /^Taskosaur: https:\/\/work\.rickvang\.com\/[a-z0-9-]+\/[a-z0-9-]+\/tasks\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\/?\s*$/i,
                );
              if (!match)
                throw Error(`PR #${number} has an invalid or ambiguous Taskosaur link`);
              const rollup = pr.commits.nodes[0]?.commit.statusCheckRollup?.contexts;
              const checks = (rollup?.nodes || [])
                .filter(
                  (c) =>
                    !["Taskosaur SDLC", "Taskosaur SDLC sync"].includes(
                      c.checkSuite?.workflowRun?.workflow.name || "",
                    ) && !c.name?.startsWith("sdlc-sync"),
                )
                .map((c) => ({
                  name: c.name || c.context || "check",
                  state:
                    c.__typename === "StatusContext"
                      ? c.state
                      : c.status === "COMPLETED"
                        ? c.conclusion
                        : "PENDING",
                }));
              let deployment

                           ;
              if (pr.state === "MERGED" && pr.mergeCommit) {
                const deployments = await github

                 (
                  `repos/${repository}/deployments?sha=${pr.mergeCommit.oid}&per_page=20`,
                );
                for (const d of deployments) {
                  const statuses = await github                                  (
                    `repos/${repository}/deployments/${d.id}/statuses?per_page=1`,
                  );
                  if (
                    statuses[0]?.state === "success" &&
                    d.environment === "production"
                  ) {
                    deployment = {
                      sha: d.sha,
                      environment: d.environment,
                      state: "success",
                      url: `https://github.com/${repository}/deployments`,
                    };
                    break;
                  }
                }
              }
              const snapshot = {
                repository,
                number,
                taskId: match[1].toLowerCase(),
                observedAt,
                head: pr.headRefOid,
                base: pr.baseRefName,
                state: pr.state,
                draft: pr.isDraft,
                mergeState: pr.mergeStateStatus,
                review: pr.reviewDecision,
                checks,
                checksComplete: Boolean(rollup && !rollup.pageInfo.hasNextPage),
                mergeCommit: pr.mergeCommit?.oid || null,
                deployment,
              };
              const oidcUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL );
              oidcUrl.searchParams.set("audience", endpoint);
              const identity = await fetch(oidcUrl, {
                headers: {
                  Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`,
                },
                signal: AbortSignal.timeout(15000),
                redirect: "error",
              });
              if (!identity.ok) throw Error(`GitHub identity HTTP ${identity.status}`);
              const token = ((await identity.json())                     ).value;
              const r = await fetch(endpoint, {
                method: "POST",
                redirect: "error",
                signal: AbortSignal.timeout(45000),
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(snapshot),
              });
              const result = (await r.json())                                       ;
              if (!r.ok)
                throw Error(
                  `Taskosaur sync #${number} HTTP ${r.status}: ${result.error}`,
                );
              summary.push(`- PR #${number}: ${result.result}`);
            } catch (error) {
              const message =
                error instanceof Error ? error.message : "Synchronization failed";
              failures.push(`PR #${number}: ${message}`);
            }
          }
          console.log(summary.join("\n") || "No explicitly linked PRs");
          if (process.env.GITHUB_STEP_SUMMARY)
            await appendFile(
              process.env.GITHUB_STEP_SUMMARY,
              `${summary.join("\n") || "No explicitly linked PRs"}\n`,
            );
          if (failures.length) throw Error(failures.join("\n"));
          SDLC_SCRIPT
