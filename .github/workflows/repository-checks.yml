name: Repository checks
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check patch integrity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git -c core.whitespace=cr-at-eol diff --check "$BASE_SHA" HEAD
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
