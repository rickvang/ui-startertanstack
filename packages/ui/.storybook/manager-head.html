<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
/>
<style>
    /* Editorial library chrome — strip stock Storybook chrome noise */

    .sidebar-header {
        padding: 1.35rem 1rem 1rem !important;
        border-bottom: 1px solid #e5ded2 !important;
    }

    .sidebar-header a {
        display: flex !important;
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 0.15rem !important;
        font-family: "Fraunces", Georgia, serif !important;
        font-size: 1.2rem !important;
        font-weight: 550 !important;
        letter-spacing: -0.03em !important;
        color: #2a2620 !important;
        line-height: 1.15 !important;
    }

    .sidebar-header a::after {
        content: "Design system";
        font-family: "Instrument Sans", "Segoe UI", sans-serif;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b655c;
    }

    .sidebar-header img {
        display: none !important;
    }

    /* Hide Storybook checklist / onboarding widget (feature flag + CSS backup) */
    #storybook-checklist-widget {
        display: none !important;
    }

    /* Hide node-type icons (component/story marks). Keep expand chevrons. */
    #storybook-explorer-menu svg[type="component"],
    #storybook-explorer-menu svg[type="story"],
    #storybook-explorer-menu svg[type="group"],
    #storybook-explorer-menu svg[type="document"],
    #storybook-explorer-menu use[href^="#icon--"],
    #storybook-explorer-menu use[xlink\:href^="#icon--"] {
        display: none !important;
    }

    /* Hide per-row context menus — catalog index, not Storybook power-user chrome */
    #storybook-explorer-menu [data-testid="context-menu"] {
        display: none !important;
    }

    /* Underline-style search */
    .search-field {
        border: none !important;
        border-bottom: 1px solid #e5ded2 !important;
        border-radius: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        margin: 0.85rem 1rem 0.35rem !important;
    }

    /*
     * Section roots — research-aligned (Carbon Storybook + Denali sidebar guidance):
     * de-emphasized labels, not chrome. Small uppercase muted type, space above,
     * no fill / no hairline bars. Rows below stay the primary interactive content.
     */
    #storybook-explorer-menu .sidebar-subheading,
    #storybook-explorer-menu [data-nodetype="root"] {
        display: flex !important;
        align-items: center !important;
        gap: 0 !important;
        margin: 1rem 0 0.15rem !important;
        padding: 0.15rem 0.5rem 0.1rem !important;
        border: 0 !important;
        border-radius: 0 !important;
        background: transparent !important;
        opacity: 1 !important;
    }

    #storybook-explorer-menu .sidebar-subheading:first-of-type,
    #storybook-explorer-menu [data-nodetype="root"]:first-of-type {
        margin-top: 0.35rem !important;
    }

    #storybook-explorer-menu .sidebar-subheading > button[data-action="collapse-root"],
    #storybook-explorer-menu [data-nodetype="root"] > button[data-action="collapse-root"] {
        flex: 1 1 auto !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 0.4rem !important;
        min-height: 1.35rem !important;
        padding: 0.2rem 0.15rem !important;
        border: 0 !important;
        background: transparent !important;
        color: #6b655c !important;
        font-family: "Instrument Sans", "Segoe UI", sans-serif !important;
        font-size: 0.6875rem !important; /* ~11px — Carbon root scale */
        font-weight: 700 !important;
        letter-spacing: 0.11em !important;
        text-transform: uppercase !important;
        cursor: pointer !important;
        text-align: left !important;
    }

    #storybook-explorer-menu .sidebar-subheading > button[data-action="collapse-root"]:hover,
    #storybook-explorer-menu [data-nodetype="root"] > button[data-action="collapse-root"]:hover {
        color: #2a2620 !important;
    }

    #storybook-explorer-menu .sidebar-subheading > button[data-action="collapse-root"] svg,
    #storybook-explorer-menu [data-nodetype="root"] > button[data-action="collapse-root"] svg {
        width: 8px !important;
        height: 8px !important;
        flex-shrink: 0 !important;
        opacity: 0.65 !important;
        color: inherit !important;
    }

    /* Expand-all is noise in a library index */
    #storybook-explorer-menu .sidebar-subheading-action {
        display: none !important;
    }

    /* Body rows read stronger than section labels (Denali: headers deemphasized vs links) */
    #storybook-explorer-menu .sidebar-item > button,
    #storybook-explorer-menu .sidebar-item > a {
        font-size: 0.875rem !important;
        font-weight: 400 !important;
        color: #2a2620 !important;
        letter-spacing: 0 !important;
        text-transform: none !important;
    }

    /* Soft selected: teal ink + inset rail */
    #storybook-explorer-menu .sidebar-item[data-selected="true"],
    #storybook-explorer-menu [data-selected="true"] {
        background: transparent !important;
        background-color: transparent !important;
        color: #115e59 !important;
        font-weight: 600 !important;
        box-shadow: inset 2px 0 0 #0f766e !important;
        border-radius: 0 !important;
    }

    #storybook-explorer-menu .sidebar-item[data-selected="true"] a,
    #storybook-explorer-menu .sidebar-item[data-selected="true"] button,
    #storybook-explorer-menu .sidebar-item[data-selected="true"] span {
        color: #115e59 !important;
    }

    #storybook-explorer-menu .sidebar-item[data-selected="true"]:hover,
    #storybook-explorer-menu [data-selected="true"]:hover {
        background: transparent !important;
        background-color: transparent !important;
        color: #115e59 !important;
    }

    [role="tablist"] button[role="tab"] {
        letter-spacing: 0.01em;
        font-weight: 500 !important;
    }

    :focus-visible {
        outline-color: #0f766e !important;
    }
</style>
